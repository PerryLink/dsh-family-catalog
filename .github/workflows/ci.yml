name: ci

# dsh-catalog had no CI. Its only automated gate was .githooks/pre-push, which
# is opt-in per clone (`git config core.hooksPath .githooks`) and therefore
# absent on any machine that did not enable it — including the two commits that
# turned consecutive `main` deploys red on 2026-09-09. This workflow runs the
# same checks server-side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  data:
    name: catalog data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Read-only. Reproduces both 2026-09-09 incidents: a malformed
      # data/packages.json, and a listed package with no
      # data/npm-snapshot.json row.
      - run: node scripts/check-data.mjs

  artifacts:
    name: deployed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validate what actually ships — the committed deploy/ copies. The
      # validator resolves deploy/ first (both repository-root paths are
      # gitignored, so a fresh clone has none), and holds page.total to
      # items.length so the page cannot advertise a count its items contradict.
      - name: Validate the committed deploy artifacts
        run: node scripts/validate.mjs

      # The family count has one source of truth (data/packages.json). This
      # holds the README summaries, the manifest description, the shipped page
      # and the deploy live-smoke floor to it, so a hand-edited number cannot
      # drift again (this repo shipped 44 in prose against 43 shipped items).
      - name: Counts must derive from data/packages.json
        run: node scripts/check-counts.mjs

      # Catches "data/ changed but deploy/ was never rebuilt". The no-argument
      # build is safe here, and only here, because this checkout is throwaway:
      # it rewrites the tracked deploy/ copies with the same placeholder origin
      # they are committed with, and catalog-source.json carries no timestamp
      # (unlike deploy/artifacts/v1/plugins.json, whose generatedAt/revision
      # always differ). README §Build forbids the no-argument build as a *local*
      # gate for exactly that rewriting reason.
      - name: The committed deploy manifest must match a fresh build
        run: |
          node scripts/build-catalog.mjs
          git diff --exit-code -- deploy/catalog-source.json
      - name: The display sidecar must match a fresh build
        run: |
          node scripts/build-catalog.mjs
          git diff --exit-code -- deploy/artifacts/v1/display.json

  discovery:
    name: discovery sidecars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # P2: 126/126 facet coverage, 10 hubs, reconciled maintenance counts.
      - name: Facet/status sidecar and hubs
        run: node scripts/check-facets.mjs

      # P1/P3: the index must keep hitting the 50-query bench.
      - name: 50-query discovery bench
        run: node scripts/discovery-bench.mjs --source=index --fail-under=85

      - name: Held-out discovery bench (not tuned)
        run: node scripts/discovery-bench.mjs --source=index --bench-file=data/discovery-bench-heldout.json --fail-under=85

      # P3: worker routes (search, plugin, hubs, 100+26 pagination).
      - name: Worker routes and pagination
        run: node scripts/worker-smoke.mjs

      # P3: stdio MCP plugin_search/plugin_get.
      - name: MCP tools
        run: node scripts/mcp-smoke.mjs

      # Catches "data/ changed but the sidecars were never rebuilt". Both
      # builds are byte-reproducible (no timestamps).
      - name: Sidecars must match a fresh build
        run: |
          node scripts/build-discovery.mjs
          node scripts/build-facets.mjs
          git diff --exit-code -- deploy/artifacts/v1/search-index.json deploy/search-core.mjs deploy/artifacts/v1/hubs.json data/facets.json

  types:
    name: type ruler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The published-line ruler: `typecheck:ci` existed as a script but no
      # workflow ever invoked it, so the generator scripts' types were only ever
      # checked by hand (the 76 pre-existing errors R19 recorded). This repo
      # tracks no lockfile - its other gates are dependency-free node scripts -
      # so the install cannot be frozen; the compiler version comes from
      # package.json's devDependencies.
      - run: npm install --no-audit --no-fund

      - name: Typecheck (published line)
        run: npm run typecheck:ci

